# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Hosted on Vercel. Replace the *.vercel.app host below with your actual
# Vercel production domain, then run `shopify app deploy`.

client_id = "91519cbde6355e1bbc0c755ec8ee7a35"
application_url = "https://real-cod-order.vercel.app"
embedded = true
name = "Real COD Order"

[app_proxy]
url = "https://real-cod-order.vercel.app"
subpath = "cod"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_shipping,read_payment_terms,unauthenticated_read_checkouts,unauthenticated_read_product_listings,unauthenticated_write_checkouts,write_app_proxy,write_draft_orders,write_orders"

[auth]
redirect_urls = [
  "https://real-cod-order.vercel.app/auth/callback",
  "https://real-cod-order.vercel.app/auth/shopify/callback",
  "https://real-cod-order.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = false
