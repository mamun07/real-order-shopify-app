# fly.toml app configuration file generated for real-order on 2026-08-27T12:37:33+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'real-order'
primary_region = 'sin'

[build]
[env]
  PORT = '3000'
  DATABASE_URL = 'file:/data/dev.sqlite'
  NODE_ENV = 'production'
  SCOPES = 'read_products,read_shipping,unauthenticated_read_checkouts,unauthenticated_read_product_listings,unauthenticated_write_checkouts,write_draft_orders,write_orders'
  SHOPIFY_API_KEY = '78f9b5e49d8bebc5cf3ee772d58b1136'
  SHOPIFY_APP_URL = 'https://real-order.fly.dev'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
